<!DOCTYPE html>
<html>
<head>
  <title>Material Calculator</title>
</head>
<body>

  <label for="itemSelect">Choose a material:</label>
  <select id="itemSelect" onchange="handleSelection()">
    <option value="">--Select--</option>
  </select>

  <label for="quantityInput">Quantity:</label>
  <input type="number" id="quantityInput" min="1" value="1" onchange="handleSelection()">

  <p id="output"></p>

  <label for="tierFilter">Max Tier:</label>
  <select id="tierFilter" onchange="handleSelection()">
  <option value="5">5</option>
  <option value="4">4</option>
  <option value="3">3</option>
  <option value="2">2</option>
  <option value="1">1</option>
  <option value="0">0</option>
  </select>
  <script src="scripts/main.js"></script>

</body>
</html>
